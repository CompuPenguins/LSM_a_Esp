<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inferencia de LSM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            background-color: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background-color: #f0f2ff;
        }
        
        .upload-area.dragover {
            background-color: #e8e9ff;
            border-color: #764ba2;
        }
        
        #inputImage {
            display: none;
        }
        
        .upload-text {
            color: #667eea;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .upload-small {
            color: #999;
            font-size: 12px;
        }
        
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #inferButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #inferButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        #inferButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #clearButton {
            background: #f0f0f0;
            color: #333;
        }
        
        #clearButton:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-section {
            display: none;
            background-color: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .result-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-item label {
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }
        
        .result-item value {
            color: #667eea;
            font-weight: 700;
            font-size: 16px;
        }
        
        .error {
            background-color: #fee;
            border-left: 4px solid #f00;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .status {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Inferencia de LSM</h1>
        <p class="subtitle">Lengua de Señas Mexicana - Reconocimiento de Glosas</p>
        
        <div class="upload-area" id="uploadArea">
            <p class="upload-text">📁 Arrastra una imagen aquí o haz clic para seleccionar</p>
            <p class="upload-small">Formatos soportados: JPG, PNG, GIF, BMP</p>
            <input type="file" id="inputImage" accept="image/*">
        </div>
        
        <img id="preview" alt="Preview">
        
        <div class="button-group">
            <button id="inferButton" disabled>Realizar Inferencia</button>
            <button id="clearButton">Limpiar</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Procesando imagen...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-section" id="resultSection">
            <h3>Resultados</h3>
            <div id="resultContent"></div>
        </div>
        
        <div class="status" id="status">Listo para procesar imágenes</div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const inputImage = document.getElementById('inputImage');
        const preview = document.getElementById('preview');
        const inferButton = document.getElementById('inferButton');
        const clearButton = document.getElementById('clearButton');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        const status = document.getElementById('status');

        // Drag and drop
        uploadArea.addEventListener('click', () => inputImage.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                inputImage.files = files;
                handleImageSelect();
            }
        });

        // Manejo de selección de imagen
        inputImage.addEventListener('change', handleImageSelect);

        function handleImageSelect() {
            const file = inputImage.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    inferButton.disabled = false;
                    resultSection.classList.remove('show');
                    errorDiv.classList.remove('show');
                };
                reader.readAsDataURL(file);
            }
        }

        // Realizar inferencia
        inferButton.addEventListener('click', async () => {
            const file = inputImage.files[0];
            if (!file) {
                showError('Por favor selecciona una imagen');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            loading.style.display = 'block';
            errorDiv.classList.remove('show');
            status.textContent = 'Procesando...';

            try {
                const response = await fetch('/infer', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error en la inferencia');
                }

                displayResults(data.output);
                status.textContent = 'Inferencia completada';
            } catch (error) {
                showError('Error: ' + error.message);
                status.textContent = 'Error en el proceso';
            } finally {
                loading.style.display = 'none';
            }
        });

        // Limpiar
        clearButton.addEventListener('click', () => {
            inputImage.value = '';
            preview.style.display = 'none';
            inferButton.disabled = true;
            resultSection.classList.remove('show');
            errorDiv.classList.remove('show');
            status.textContent = 'Listo para procesar imágenes';
        });

        function displayResults(output) {
            resultContent.innerHTML = '';
            
            if (Array.isArray(output)) {
                if (output[0] && Array.isArray(output[0])) {
                    // Si el output es [[[...]], ...], acceder al primer elemento
                    output = output[0];
                }
                
                if (output.length > 0 && Array.isArray(output[0])) {
                    output = output[0];
                }
            }

            if (typeof output === 'number') {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `<label>Predicción:</label><value>${output.toFixed(6)}</value>`;
                resultContent.appendChild(item);
            } else if (Array.isArray(output)) {
                // Mostrar top 5 predicciones si hay muchas clases
                const topCount = Math.min(5, output.length);
                const indices = Array.from(output)
                    .map((val, idx) => ({ val: parseFloat(val), idx }))
                    .sort((a, b) => b.val - a.val)
                    .slice(0, topCount);

                indices.forEach((item, rank) => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `
                        <label>#${rank + 1} - Clase ${item.idx}</label>
                        <value>${(item.val * 100).toFixed(2)}%</value>
                    `;
                    resultContent.appendChild(div);
                });
            }

            resultSection.classList.add('show');
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // Verificar conexión con el servidor
        async function checkServerStatus() {
            try {
                const response = await fetch('/model-info');
                if (response.ok) {
                    status.textContent = 'Conectado al servidor ✓';
                }
            } catch (error) {
                status.textContent = 'Error de conexión ✗';
            }
        }

        checkServerStatus();
    </script>
</body>
</html>
