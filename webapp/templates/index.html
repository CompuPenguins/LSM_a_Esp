<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LSM · Traductor de Lengua de Señas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ── Design tokens ────────────────────────────────────────────────── */
:root {
  --bg:        #0f1117;
  --surface:   #181c27;
  --border:    #2a2f3d;
  --accent:    #e8a045;
  --accent2:   #3ecfb0;
  --text:      #e8e4db;
  --muted:     #7a8099;
  --bubble-out:#1e2538;
  --bubble-in: #1b2b28;
  --danger:    #e05c5c;
  --radius:    18px;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans:  'DM Sans', sans-serif;
}

/* ── Reset ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ─────────────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  gap: 12px;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.logo-hand { font-size: 1.5rem; line-height: 1; }
.logo-text {
  font-family: var(--font-serif);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.logo-sub {
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* sign-panel toggle button in header */
#btn-toggle-sign {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 7px 14px;
  border-radius: 30px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  transition: all .2s;
}
#btn-toggle-sign:hover { border-color: var(--accent2); color: var(--accent2); }
#btn-toggle-sign.active { border-color: var(--accent2); color: var(--accent2); background: rgba(62,207,176,.08); }

/* ── Layout wrapper ─────────────────────────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Chat panel ─────────────────────────────────────────────────────── */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* messages list */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* empty state */
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--muted);
  pointer-events: none;
  user-select: none;
}
.empty-state .big-hand { font-size: 3.5rem; margin-bottom: 12px; opacity: .5; }
.empty-state p { font-family: var(--font-serif); font-size: 1.1rem; font-style: italic; }
.empty-state small { font-size: 0.75rem; margin-top: 6px; display: block; }

/* message rows */
.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 72%;
  animation: fadeUp .25s ease both;
}
.msg-row.outgoing { align-self: flex-end; align-items: flex-end; }
.msg-row.incoming { align-self: flex-start; align-items: flex-start; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* direction label */
.msg-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
  padding: 0 4px;
}
.msg-row.outgoing .msg-label { color: var(--accent); }
.msg-row.incoming .msg-label { color: var(--accent2); }

/* bubble */
.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 0.95rem;
  line-height: 1.55;
  word-break: break-word;
  position: relative;
}
.msg-row.outgoing .bubble {
  background: var(--bubble-out);
  border: 1px solid #2e3550;
  border-bottom-right-radius: 5px;
}
.msg-row.incoming .bubble {
  background: var(--bubble-in);
  border: 1px solid #1f3a35;
  border-bottom-left-radius: 5px;
}
.bubble.loading {
  color: var(--muted);
  font-style: italic;
}
.bubble.error { color: var(--danger); border-color: rgba(224,92,92,.3); }

/* typing dots */
.dots span {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--muted);
  border-radius: 50%;
  margin: 0 2px;
  animation: blink 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: .2; }
  40%           { opacity: 1; }
}

/* ── Composer ────────────────────────────────────────────────────────── */
.composer {
  flex-shrink: 0;
  padding: 14px 20px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

/* direction pill selector */
.dir-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.dir-btn {
  flex: 1;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
.dir-btn:hover { border-color: var(--accent); color: var(--accent); }
.dir-btn.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #0f1117;
  font-weight: 500;
}
.dir-btn.selected .arrow { opacity: 1; }
.dir-btn.selected.lsm-dir {
  background: var(--accent2);
  border-color: var(--accent2);
}

/* input row */
.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

textarea#msg-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  padding: 12px 16px;
  resize: none;
  min-height: 48px;
  max-height: 160px;
  line-height: 1.5;
  overflow-y: auto;
  transition: border-color .2s;
  outline: none;
}
textarea#msg-input:focus { border-color: var(--accent); }
textarea#msg-input::placeholder { color: var(--muted); }

#btn-send {
  flex-shrink: 0;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .2s, opacity .2s;
}
#btn-send:hover { transform: scale(1.08); }
#btn-send:active { transform: scale(0.95); }
#btn-send:disabled { opacity: .4; cursor: not-allowed; transform: none; }
#btn-send svg { width: 20px; height: 20px; fill: #0f1117; }

#btn-mic {
  flex-shrink: 0;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
#btn-mic:hover { border-color: var(--accent); color: var(--accent); }
#btn-mic.listening {
  background: rgba(224,92,92,.15);
  border-color: var(--danger);
  color: var(--danger);
  animation: mic-pulse 1.4s ease infinite;
}
#btn-mic svg { width: 18px; height: 18px; fill: currentColor; }
@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224,92,92,.4); }
  50%       { box-shadow: 0 0 0 7px rgba(224,92,92,0); }
}
#stt-unsupported { display:none; font-size:0.7rem; color:var(--danger); text-align:center; margin-top:4px; }

/* ── Sign panel (collapsible, side drawer) ──────────────────────────── */
.sign-panel {
  width: 0;
  overflow: hidden;
  transition: width .35s cubic-bezier(.4,0,.2,1);
  border-left: none;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.sign-panel.open {
  width: 340px;
  border-left: 1px solid var(--border);
}

.sign-inner {
  width: 340px;
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 14px;
}

.sign-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent2);
  letter-spacing: -0.01em;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

#video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  background: #0a0c11;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
#webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#overlay-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.cam-off-msg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px;
  color: var(--muted); font-size: 0.8rem; text-align: center;
}
.cam-off-msg span { font-size: 2rem; }

/* sign controls */
.sign-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.ctrl-btn {
  flex: 1;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.ctrl-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ctrl-btn.primary {
  background: var(--accent2);
  border-color: var(--accent2);
  color: #0f1117;
  font-weight: 500;
}
.ctrl-btn.danger { border-color: var(--danger); color: var(--danger); }
.ctrl-btn:disabled { opacity: .4; cursor: not-allowed; }

/* recording indicator */
.rec-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--danger);
  margin-right: 5px;
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .3; }
}

/* sign result card */
.sign-result {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  display: none;
  flex-direction: column;
  gap: 8px;
}
.sign-result.visible { display: flex; }
.sign-glosa {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--accent2);
}
.sign-conf { font-size: 0.75rem; color: var(--muted); }
.conf-bar {
  height: 4px; background: var(--border); border-radius: 4px; overflow: hidden;
}
.conf-fill {
  height: 100%; background: var(--accent2); border-radius: 4px;
  transition: width .4s;
}
.top3-list { display: flex; flex-direction: column; gap: 4px; }
.top3-item {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.78rem; color: var(--muted);
}
.top3-item .lbl { font-weight: 500; color: var(--text); }
.top3-item .pct { color: var(--accent); }

/* btn to insert sign result into chat */
#btn-insert-sign {
  padding: 10px;
  border-radius: 10px;
  border: 1px dashed var(--accent2);
  background: transparent;
  color: var(--accent2);
  font-family: var(--font-sans);
  font-size: 0.8rem;
  cursor: pointer;
  width: 100%;
  transition: all .2s;
  display: none;
}
#btn-insert-sign.visible { display: block; }
#btn-insert-sign:hover { background: rgba(62,207,176,.08); }

/* mirror toggle */
.mirror-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.mirror-row input[type=checkbox] { accent-color: var(--accent2); }

/* ── Scrollbar global ────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .sign-panel.open { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  .layout { flex-direction: column; }
}
</style>
</head>
<body>

<!-- ════════════════════════ HEADER ════════════════════════ -->
<header>
  <div class="logo">
    <span class="logo-hand">🤟</span>
    <div>
      <div class="logo-text">LSM</div>
      <div class="logo-sub">Lengua de Señas Mexicana</div>
    </div>
  </div>

  <button id="btn-toggle-sign" title="Reconocimiento de señas">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 10l4.553-2.07A1 1 0 0 1 21 8.82V14a1 1 0 0 1-1.447.894L15 13M3 8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
    Cámara
  </button>
</header>

<!-- ════════════════════════ LAYOUT ════════════════════════ -->
<div class="layout">

  <!-- ─── CHAT PANEL ──────────────────────────────────────── -->
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="big-hand">🤟</div>
        <p>Elige una dirección y empieza a traducir</p>
        <small>Español ↔ Lengua de Señas Mexicana</small>
      </div>
    </div>

    <!-- Composer -->
    <div class="composer">
      <div class="dir-selector">
        <button class="dir-btn selected" id="btn-esp" data-dir="esp_to_lsm">
          🇲🇽 Español → LSM
        </button>
        <button class="dir-btn lsm-dir" id="btn-lsm" data-dir="lsm_to_esp">
          🤟 LSM → Español
        </button>
      </div>
      <div class="input-row">
        <textarea id="msg-input" rows="1"
          placeholder="Escribe aquí…"></textarea>
        <button id="btn-mic" title="Mantén pulsado para dictar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 18.93V22h2v-2.07A8.001 8.001 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8.001 8.001 0 0 0 7 7.93z"/>
          </svg>
        </button>
        <button id="btn-send" title="Enviar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div id="stt-unsupported">⚠ Tu navegador no soporta dictado de voz</div>
    </div>
  </div>

  <!-- ─── SIGN PANEL ──────────────────────────────────────── -->
  <div class="sign-panel" id="sign-panel">
    <div class="sign-inner">
      <div class="sign-title">🎥 Reconocimiento de Señas</div>

      <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
        <div class="cam-off-msg" id="cam-off-msg">
          <span>📷</span>
          <p>Activa la cámara para<br>reconocer señas</p>
        </div>
      </div>

      <div class="sign-controls">
        <button class="ctrl-btn primary" id="btn-cam">Activar cámara</button>
        <button class="ctrl-btn" id="btn-record" disabled>⏺ Grabar</button>
        <button class="ctrl-btn danger" id="btn-stop" disabled>⏹ Detener</button>
      </div>

      <label class="mirror-row">
        <input type="checkbox" id="mirror-check" />
        Espejo (voltear imagen)
      </label>

      <div class="sign-result" id="sign-result">
        <div class="sign-glosa" id="res-glosa">—</div>
        <div class="conf-bar"><div class="conf-fill" id="res-bar" style="width:0%"></div></div>
        <div class="sign-conf" id="res-conf">Confianza: —</div>
        <div class="top3-list" id="res-top3"></div>
      </div>

      <button id="btn-insert-sign">
        ↩ Insertar glosa en el chat
      </button>
    </div>
  </div>

</div><!-- .layout -->

<script>
// ── State ─────────────────────────────────────────────────────────────────
let direction  = 'esp_to_lsm';   // current translation direction
let lastGlosa  = '';              // last recognized sign glosa
let isSending  = false;

// ── Element refs ──────────────────────────────────────────────────────────
const messagesEl  = document.getElementById('messages');
const emptyState  = document.getElementById('empty-state');
const msgInput    = document.getElementById('msg-input');
const btnSend     = document.getElementById('btn-send');
const btnEsp      = document.getElementById('btn-esp');
const btnLsm      = document.getElementById('btn-lsm');
const btnTogSign  = document.getElementById('btn-toggle-sign');
const signPanel   = document.getElementById('sign-panel');

// sign refs
const webcamEl    = document.getElementById('webcam');
const camOffMsg   = document.getElementById('cam-off-msg');
const btnCam      = document.getElementById('btn-cam');
const btnRecord   = document.getElementById('btn-record');
const btnStop     = document.getElementById('btn-stop');
const mirrorChk   = document.getElementById('mirror-check');
const signResult  = document.getElementById('sign-result');
const resGlosa    = document.getElementById('res-glosa');
const resBar      = document.getElementById('res-bar');
const resConf     = document.getElementById('res-conf');
const resTop3     = document.getElementById('res-top3');
const btnInsert   = document.getElementById('btn-insert-sign');

// ── Direction buttons ─────────────────────────────────────────────────────
[btnEsp, btnLsm].forEach(btn => {
  btn.addEventListener('click', () => {
    direction = btn.dataset.dir;
    btnEsp.classList.toggle('selected', direction === 'esp_to_lsm');
    btnLsm.classList.toggle('selected', direction === 'lsm_to_esp');
    msgInput.placeholder = direction === 'esp_to_lsm'
      ? 'Escribe en español…'
      : 'Escribe en LSM (glosas)…';
    msgInput.focus();
  });
});

// ── Sign panel toggle ─────────────────────────────────────────────────────
btnTogSign.addEventListener('click', () => {
  signPanel.classList.toggle('open');
  btnTogSign.classList.toggle('active', signPanel.classList.contains('open'));
});

// ── Textarea auto-grow ────────────────────────────────────────────────────
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Send ──────────────────────────────────────────────────────────────────
btnSend.addEventListener('click', sendMessage);

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isSending) return;

  isSending = true;
  btnSend.disabled = true;
  emptyState.remove && emptyState.parentNode && emptyState.remove();

  // Outgoing bubble
  const dirLabel = direction === 'esp_to_lsm' ? '🇲🇽 Español' : '🤟 LSM';
  appendBubble('outgoing', dirLabel, text);
  msgInput.value = '';
  msgInput.style.height = 'auto';

  // Loading bubble
  const loadingId = 'loading-' + Date.now();
  appendLoadingBubble(loadingId);

  try {
    const res = await fetch('/translate', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ text, direction }),
    });
    const data = await res.json();
    removeLoadingBubble(loadingId);

    if (data.error) {
      appendBubble('incoming', '⚠ Error', data.error, true);
    } else {
      const replyLabel = direction === 'esp_to_lsm' ? '🤟 LSM' : '🇲🇽 Español';
      appendBubble('incoming', replyLabel, data.translation);
    }
  } catch (err) {
    removeLoadingBubble(loadingId);
    appendBubble('incoming', '⚠ Error', 'No se pudo conectar al servidor.', true);
  }

  isSending = false;
  btnSend.disabled = false;
  msgInput.focus();
}

function appendBubble(side, label, text, isError = false) {
  const row = document.createElement('div');
  row.className = `msg-row ${side}`;

  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = label;

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = text;

  row.appendChild(lbl);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendLoadingBubble(id) {
  const row = document.createElement('div');
  row.className = 'msg-row incoming';
  row.id = id;

  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = '✦ Traduciendo';

  const bubble = document.createElement('div');
  bubble.className = 'bubble loading';
  bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

  row.appendChild(lbl);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeLoadingBubble(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── Webcam & recording ────────────────────────────────────────────────────
let stream      = null;
let mediaRec    = null;
let recordedChunks = [];

btnCam.addEventListener('click', async () => {
  if (stream) {
    stopCamera(); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    webcamEl.srcObject = stream;
    camOffMsg.style.display = 'none';
    btnCam.textContent = '⏏ Detener cámara';
    btnRecord.disabled = false;
  } catch (err) {
    alert('No se pudo acceder a la cámara: ' + err.message);
  }
});

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  webcamEl.srcObject = null;
  camOffMsg.style.display = '';
  btnCam.textContent = 'Activar cámara';
  btnRecord.disabled = true;
  btnStop.disabled   = true;
}

btnRecord.addEventListener('click', () => {
  if (!stream) return;
  recordedChunks = [];
  mediaRec = new MediaRecorder(stream, { mimeType: 'video/webm' });
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRec.onstop = processRecording;
  mediaRec.start();
  btnRecord.innerHTML = '<span class="rec-dot"></span> Grabando…';
  btnRecord.disabled = true;
  btnStop.disabled   = false;
});

btnStop.addEventListener('click', () => {
  if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  btnRecord.textContent = '⏺ Grabar';
  btnRecord.disabled = false;
  btnStop.disabled   = true;
});

async function processRecording() {
  const blob    = new Blob(recordedChunks, { type: 'video/webm' });
  const frames  = await extractFrames(blob, 30);  // max 30 frames
  if (!frames.length) return;

  signResult.classList.add('visible');
  resGlosa.textContent = '…';
  resConf.textContent  = 'Procesando…';
  resBar.style.width   = '0%';
  resTop3.innerHTML    = '';
  btnInsert.classList.remove('visible');

  try {
    const res = await fetch('/infer', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ frames, mirror: mirrorChk.checked }),
    });
    const data = await res.json();
    if (data.error) { resGlosa.textContent = 'Error'; resConf.textContent = data.error; return; }

    lastGlosa = data.glosa;
    resGlosa.textContent  = data.glosa;
    resConf.textContent   = `Confianza: ${(data.conf * 100).toFixed(1)}%`;
    resBar.style.width    = (data.conf * 100).toFixed(1) + '%';

    resTop3.innerHTML = '';
    (data.top3 || []).forEach(([lbl, p]) => {
      resTop3.innerHTML += `<div class="top3-item">
        <span class="lbl">${lbl}</span>
        <span class="pct">${(p*100).toFixed(1)}%</span></div>`;
    });

    btnInsert.classList.add('visible');
  } catch (err) {
    resGlosa.textContent = 'Error';
    resConf.textContent  = 'No se pudo conectar con el servidor.';
  }
}

async function extractFrames(blob, maxFrames) {
  return new Promise(resolve => {
    const url    = URL.createObjectURL(blob);
    const video  = document.createElement('video');
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    const frames = [];

    video.src    = url;
    video.muted  = true;
    video.onloadedmetadata = () => {
      const dur      = video.duration;
      const interval = dur / Math.min(maxFrames, 30);
      let   t        = 0;

      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;

      const step = () => {
        if (t > dur || frames.length >= maxFrames) {
          URL.revokeObjectURL(url);
          resolve(frames);
          return;
        }
        video.currentTime = t;
        t += interval;
      };

      video.onseeked = () => {
        ctx.drawImage(video, 0, 0);
        const b64 = canvas.toDataURL('image/jpeg', 0.85)
                          .replace(/^data:image\/\w+;base64,/, '');
        frames.push(b64);
        step();
      };

      step();
    };
    video.onerror = () => resolve([]);
    video.load();
  });
}

// Insert last recognized glosa into chat input
btnInsert.addEventListener('click', () => {
  if (!lastGlosa) return;
  msgInput.value = lastGlosa;
  msgInput.dispatchEvent(new Event('input'));
  msgInput.focus();
});

// ── Speech-to-Text (server-side via faster-whisper — works in all browsers) ──
const btnMic   = document.getElementById('btn-mic');
const sttUnsup = document.getElementById('stt-unsupported');

if (!navigator.mediaDevices || !window.MediaRecorder) {
  btnMic.style.display   = 'none';
  sttUnsup.style.display = 'block';
} else {
  let micStream   = null;
  let micRec      = null;
  let micChunks   = [];
  let isListening = false;

  btnMic.addEventListener('click', async () => {
    if (isListening) {
      // ── Stop recording ──────────────────────────────────────────────
      micRec.stop();
      return;
    }

    // ── Start recording ─────────────────────────────────────────────
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (err) {
      alert('No se pudo acceder al micrófono: ' + err.message);
      return;
    }

    micChunks = [];

    // Pick best supported mime type
    const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';

    micRec = new MediaRecorder(micStream, mimeType ? { mimeType } : {});
    micRec.ondataavailable = e => { if (e.data.size > 0) micChunks.push(e.data); };
    micRec.onstop = async () => {
      // Stop mic tracks
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;

      isListening = false;
      btnMic.classList.remove('listening');
      btnMic.title    = 'Dictado de voz';
      btnMic.disabled = true;   // disable while transcribing

      const blob     = new Blob(micChunks, { type: micRec.mimeType || 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', blob, 'recording' + (micRec.mimeType?.includes('ogg') ? '.ogg' : '.webm'));

      try {
        const res  = await fetch('/stt', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) {
          alert('Error STT: ' + data.error);
        } else if (data.text) {
          // Put transcription in input and auto-send
          msgInput.value = data.text;
          msgInput.dispatchEvent(new Event('input'));
          await sendMessage();
        }
      } catch (err) {
        alert('No se pudo conectar con el servidor para STT.');
      } finally {
        btnMic.disabled = false;
      }
    };

    micRec.start();
    isListening = true;
    btnMic.classList.add('listening');
    btnMic.title = 'Detener y transcribir';
  });
}
